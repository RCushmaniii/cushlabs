name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs before the build so a lint or type error fails fast. This step is the
      # reason the gate stays green: `npm run check` sat at 26 errors on main for an
      # unknown stretch precisely because nothing here ran it.
      - name: Lint + typecheck
        run: npm run check
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Smoke tests
        run: npm test
