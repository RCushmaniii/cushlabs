name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # A superseded push should stop costing money. Without this, pushing twice to
  # an open PR leaves the first run burning minutes to completion for a commit
  # nobody is waiting on any more.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Default is 360 minutes. One hung job would eat a fifth of the
    # monthly allowance before anyone noticed.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs before the build so a lint or type error fails fast. This step is the
      # reason the gate stays green: `npm run check` sat at 26 errors on main for an
      # unknown stretch precisely because nothing here ran it.
      # Runs before anything else and on every PR: the cheapest moment to stop a
      # credential is before it is pushed. A live MySQL password sat in this repo's
      # history from the v1.0.0 redesign until GitGuardian found it on 2026-08-22 —
      # nine months, in a public repo, with the host still up.
      # Working tree only; the full-history sweep is `npm run audit:secrets:history`.
      - name: Secret scan
        run: npm run audit:secrets

      - name: Lint + typecheck
        run: npm run check
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Smoke tests
        run: npm test
