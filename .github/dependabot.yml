version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps:"
    groups:
      # One PR per month bundling all minor + patch updates.
      # Major bumps still arrive individually, for review.
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "ci:"
    groups:
      # One PR per month bundling all minor + patch updates.
      # Major bumps still arrive individually, for review.
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
