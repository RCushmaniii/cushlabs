name = "cushlabs-booking"
main = "workers/booking-worker.js"
compatibility_date = "2025-10-11"

# Backs the rate limiter. POST /book creates a real calendar event and GET
# /slots burns Google Calendar quota, both without authentication, so the
# counter has to be shared across isolates — an in-memory Map (what this
# replaced) counted per-isolate and enforced almost nothing. See
# workers/lib/rate-limit-d1.js.
[[d1_databases]]
binding = "DB"
database_name = "cushlabs-booking"
database_id = "9a3ee9e6-77f5-4ff2-b0e2-49da7456d523"

[observability]
enabled = true

[observability.logs]
enabled = true

[vars]
ALLOWED_ORIGINS = "https://cushlabs.ai,https://www.cushlabs.ai,*.cushlabs.ai,http://localhost:4321,http://localhost:4322,*.vercel.app"
GOOGLE_CALENDAR_ID = "rcushmaniii@gmail.com"
GOOGLE_CLIENT_ID = "169028283355-vev32b3a1fnaiqb63uus2fbrupa7hj0j.apps.googleusercontent.com"
PERSONAL_CALENDAR_ID = "9lg6pj8ht2blt3ob4v1rtddsts@group.calendar.google.com"
SATURDAY_HOURS = "09:00-13:00"
TIMEZONE = "America/Mexico_City"
WEEKDAY_AFTERNOON_HOURS = "16:00-20:00"
WEEKDAY_MORNING_HOURS = "09:00-14:00"
